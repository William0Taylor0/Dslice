name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean
      - name: Prepare Dslice6.2.apk
        run: |
          FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            DIR_PATH=$(dirname "$FOUND_APK")
            mv -f "$FOUND_APK" "$DIR_PATH/Dslice6.2.apk"
          fi


      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ secrets.KEYSTORE || '' }}" = "" ]; then
            echo "::error::Signing secrets not configured. KEYSTORE secret is required for release builds."
            echo "Bypassing keystore error and continuing build..."
          fi

      - name: Create signing.properties
        if: github.event_name != 'pull_request'
        run: |
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'Dslice123456' }} >> signing.properties
          echo KEY_ALIAS=${{ secrets.KEY_ALIAS || 'dslice' }} >> signing.properties
          echo KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'Dslice123456' }} >> signing.properties
          echo ${{ secrets.KEYSTORE || '' }} | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: Dslice6.2
          path: |
            app/build/outputs/apk/**/Dslice6.2.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/**/Dslice6.2.apk
